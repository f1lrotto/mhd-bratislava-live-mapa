[project]
name = "mhd-nazivo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "pyarrow>=26.0.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
