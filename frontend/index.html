<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Živá mapa vozidiel MHD v Bratislave: kde sú električky, trolejbusy a autobusy a ako ide vaša linka." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="MHD naživo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>MHD naživo · Bratislava</title>
    <script>
      // The theme before the app loads, so a dark page doesn't flash light (lib/theme.svelte.ts).
      try {
        const t = JSON.parse(localStorage.getItem('prefs') || '{}')?.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').content = '#1b1f24'
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
